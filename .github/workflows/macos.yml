name: Build StepCompass for macOS Intel
on:
  workflow_dispatch:
  push:
    branches: [stepcompass-v0.1]
    paths-ignore: ['release/**']
concurrency:
  group: stepcompass-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned framework
        run: ./scripts/bootstrap.sh
      - name: Test DSP and plugin adapter with ASan and UBSan
        run: |
          set -o pipefail
          ./scripts/test.sh 2>&1 | tee test-report.txt
      - name: Build and sign VST3
        run: |
          set -o pipefail
          ./scripts/build-macos.sh 2>&1 | tee build-report.txt
      - name: Include validation report
        if: always()
        run: |
          mkdir -p release
          if [ -f test-report.txt ]; then cp test-report.txt release/; fi
          if [ -f build-report.txt ]; then tail -n 150 build-report.txt > release/build-report.txt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: StepCompass-macOS-Intel
          path: release/
      - name: Publish downloadable ZIP and validation reports on this branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release
          git diff --cached --quiet && exit 0
          git commit -m 'Publish StepCompass build output [skip ci]'
          git push origin HEAD:stepcompass-v0.1
