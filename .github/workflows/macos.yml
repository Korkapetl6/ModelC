name: Build StepCompass for macOS Intel
on:
  workflow_dispatch:
  push:
    branches: [stepcompass-v0.1]
    paths-ignore: ['release/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned framework
        run: ./scripts/bootstrap.sh
      - name: Test DSP and plugin adapter with ASan and UBSan
        run: ./scripts/test.sh | tee test-report.txt
      - name: Build and sign VST3
        run: ./scripts/build-macos.sh
      - name: Include validation report
        run: cp test-report.txt release/test-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: StepCompass-macOS-Intel
          path: release/
      - name: Publish downloadable ZIP on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release
          git diff --cached --quiet && exit 0
          git commit -m 'Build StepCompass macOS Intel VST3 [skip ci]'
          git push origin HEAD:stepcompass-v0.1
