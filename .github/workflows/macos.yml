name: Build BeadsTable for macOS Intel
on:
  workflow_dispatch:
  push:
    branches: [beadstable-v0.1]
    paths-ignore: ['release/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned framework
        run: ./scripts/bootstrap.sh
      - name: Test DSP with ASan and UBSan
        run: ./scripts/test.sh
      - name: Build and sign VST3
        run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BeadsTable-macOS-Intel
          path: release/
      - name: Publish downloadable ZIP on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release
          git diff --cached --quiet && exit 0
          git commit -m 'Build BeadsTable macOS Intel VST3 [skip ci]'
          git push origin HEAD:beadstable-v0.1
